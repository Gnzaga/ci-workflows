# Reusable build-and-deploy workflow.
#
# Two jobs with different trust levels:
#   build   GitHub-hosted ubuntu-latest. Builds and pushes images to GHCR using
#           GITHUB_TOKEN. No environment, no deploy secrets. Always runs, but its
#           build steps are skipped when prebuilt-digests is set or images is []; in
#           those cases it only validates and passes digests through as its output.
#   deploy  ARC runner inside the cluster (LAN reach, Flannel does not enforce
#           NetworkPolicy). Runs only after build succeeds, uses the caller repo's
#           `production` environment, and only ever sees digests produced by build.
#
# Trust model: call this workflow only with code that has been reviewed and merged
# to the deploy branch. Never call it from `pull_request`, from forks, or from any
# workflow triggered by untrusted input. Deploy secrets come from the caller repo's
# `production` environment, which is restricted to the deploy branch.
#
# Flow: buildx -> push ghcr.io/gnzaga/<name>:<sha> -> digests -> (deploy job)
#   argocd:  write Harbor pull-cache refs to homelab.git (deployer App token)
#            -> ArgoCD sync and health wait.
#   komodo:  rewrite image lines in a compose file in homelab.git (deployer App
#            token) -> Komodo UpdateStack (file contents) -> DeployStack and wait for
#            the Update to complete.
#   Homelab pushes to a protected main fall back to a deploy/* PR that auto-merges.
name: build-deploy

on:
  workflow_call:
    inputs:
      app:
        description: "ArgoCD Application name (also the homelab apps file stem)"
        type: string
        required: true
      images:
        description: 'JSON list: [{"name","context","dockerfile","build-args","manifest-image"}]; paths relative to repo root. name is the GHCR package name under gnzaga/. manifest-image is the image name as written in the app manifests (optional, defaults to the pull ref). Use [] for deploy-only mode (requires deploy-target argocd and empty prebuilt-digests); required when prebuilt-digests is set'
        type: string
        required: true
      prebuilt-digests:
        description: 'JSON list of ghcr.io/gnzaga/<name>@sha256:<digest> refs from an earlier build-deploy call (its digests output). When set, nothing is built; the deploy job uses these digests. images is still required for name and manifest-image mapping'
        type: string
        default: ""
      pull-prefix:
        description: "Registry prefix cluster nodes pull through; GHCR refs are written as <pull-prefix>/gnzaga/<name>@sha256:..."
        type: string
        default: harbor.gnzaga.com/ghcr
      homelab-app-file:
        description: 'Application file path in homelab.git; the literal ${app} is replaced with the app input'
        type: string
        default: "deployment-library/k8s/gitops/apps/${app}.yaml"
      argocd-server:
        description: "ArgoCD API server reachable from the runner (host:port)"
        type: string
        default: argocd-server.argocd.svc:80
      deploy-target:
        description: "argocd: deploy job commits digests to homelab.git and syncs ArgoCD. komodo: deploy job commits digests to a compose file in homelab.git and runs a Komodo DeployStack. none: build and push only (deploy job skipped)"
        type: string
        default: argocd
      komodo-stack:
        description: "Komodo stack name to deploy (required when deploy-target is komodo)"
        type: string
        default: ""
      compose-file:
        description: "Compose file path in homelab.git, e.g. stacks/fredo/toth-collection/compose.yml (required when deploy-target is komodo)"
        type: string
        default: ""
      komodo-url:
        description: "Komodo core API base URL reachable from the runner"
        type: string
        default: http://192.168.42.27:9120
    outputs:
      digests:
        description: "JSON list of ghcr.io/gnzaga/<name>@sha256:<digest> refs: the images built by this call, or the prebuilt-digests passthrough. Feed to a second call's prebuilt-digests."
        value: ${{ jobs.build.outputs.digests }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      APP: ${{ inputs.app }}
      IMAGES: ${{ inputs.images }}
      PREBUILT_DIGESTS: ${{ inputs.prebuilt-digests }}
      DEPLOY_TARGET: ${{ inputs.deploy-target }}
      KOMODO_STACK: ${{ inputs.komodo-stack }}
      COMPOSE_FILE: ${{ inputs.compose-file }}
      GHCR_OWNER: gnzaga
      REPO_SLUG: ${{ github.repository }}
      REPO_SHA: ${{ github.sha }}
    outputs:
      digests: ${{ inputs.prebuilt-digests || steps.build.outputs.digests }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$APP" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || { echo "::error::invalid app name: ${APP}"; exit 1; }
          case "$DEPLOY_TARGET" in
            argocd|none) ;;
            komodo)
              [ -n "$KOMODO_STACK" ] || { echo "::error::komodo-stack is required when deploy-target is komodo"; exit 1; }
              [ -n "$COMPOSE_FILE" ] || { echo "::error::compose-file is required when deploy-target is komodo"; exit 1; }
              ;;
            *) echo "::error::deploy-target must be argocd, komodo or none (got: ${DEPLOY_TARGET})"; exit 1 ;;
          esac
          if [ "$(jq -c . <<<"$IMAGES")" = "[]" ]; then
            [ "$DEPLOY_TARGET" = argocd ] && [ -z "$PREBUILT_DIGESTS" ] \
              || { echo "::error::images may be [] only with deploy-target argocd and empty prebuilt-digests"; exit 1; }
          else
            jq -e 'type == "array" and length > 0 and all(.[];
              (.name | type == "string" and test("^[a-z0-9]+([._-][a-z0-9]+)*$")) and
              (.context | type == "string" and length > 0) and
              (.dockerfile | type == "string" and length > 0) and
              ((."manifest-image" // "x") | type == "string" and length > 0))' <<<"$IMAGES" >/dev/null \
              || { echo "::error::images must be a non-empty JSON array of {name, context, dockerfile[, build-args, manifest-image]} with lowercase names, or [] for deploy-only"; exit 1; }
          fi
          if [ -n "$PREBUILT_DIGESTS" ]; then
            [ "$(jq -c . <<<"$IMAGES")" != "[]" ] \
              || { echo "::error::prebuilt-digests requires images (name and manifest-image mapping)"; exit 1; }
            jq -e 'type == "array" and length > 0 and all(.[];
              type == "string" and test("^ghcr\\.io/gnzaga/[a-z0-9]+([._-][a-z0-9]+)*@sha256:[0-9a-f]{64}$"))' <<<"$PREBUILT_DIGESTS" >/dev/null \
              || { echo "::error::prebuilt-digests must be a non-empty JSON array of ghcr.io/gnzaga/<name>@sha256:<64 hex> strings"; exit 1; }
          fi

      - name: Checkout
        if: inputs.prebuilt-digests == '' && inputs.images != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        if: inputs.prebuilt-digests == '' && inputs.images != '[]'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.prebuilt-digests == '' && inputs.images != '[]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        id: build
        if: inputs.prebuilt-digests == '' && inputs.images != '[]'
        run: |
          set -euo pipefail
          t0=$(date +%s)
          work="$RUNNER_TEMP/build"
          mkdir -p "$work"
          : > "$work/refs.txt"
          while IFS= read -r img; do
            name=$(jq -r '.name' <<<"$img")
            context=$(jq -r '.context' <<<"$img")
            dockerfile=$(jq -r '.dockerfile' <<<"$img")
            args=()
            while IFS= read -r ba; do
              if [ -n "$ba" ]; then args+=(--build-arg "$ba"); fi
            done < <(jq -r '(."build-args" // "") | split("\n") | .[]' <<<"$img")
            ref="ghcr.io/${GHCR_OWNER}/${name}"
            meta="$work/meta-${name}.json"
            echo "::group::build ${name}"
            docker buildx build "$context" -f "$dockerfile" "${args[@]}" \
              --platform linux/amd64 \
              --tag "${ref}:${REPO_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${REPO_SLUG}" \
              --cache-from "type=gha,scope=${name}" \
              --cache-to "type=gha,scope=${name},mode=max" \
              --push --metadata-file "$meta" </dev/null
            echo "::endgroup::"
            digest=$(jq -r '."containerimage.digest"' "$meta")
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::error::no digest produced for ${name}"
              exit 1
            fi
            echo "${ref}@${digest}" >> "$work/refs.txt"
          done < <(jq -c '.[]' <<<"$IMAGES")
          digests=$(jq -R -s -c 'split("\n") | map(select(length > 0))' "$work/refs.txt")
          echo "digests=${digests}" >> "$GITHUB_OUTPUT"
          {
            echo "## Build ${APP}"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            while IFS= read -r ref; do
              echo "| \`${ref%@*}\` | \`${ref#*@}\` |"
            done < "$work/refs.txt"
            echo
            echo "Build and push: $(( $(date +%s) - t0 ))s"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.deploy-target == 'argocd' || inputs.deploy-target == 'komodo'
    needs: build
    runs-on: arc-${{ github.event.repository.name }}
    environment:
      name: production
      url: ${{ inputs.deploy-target == 'komodo' && format('{0}/stacks', inputs.komodo-url) || format('https://argocd.gnzaga.com/applications/argocd/{0}', inputs.app) }}
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP: ${{ inputs.app }}
      IMAGES: ${{ inputs.images }}
      DIGESTS: ${{ needs.build.outputs.digests }}
      PULL_PREFIX: ${{ inputs.pull-prefix }}
      GHCR_OWNER: gnzaga
      DEPLOY_TARGET: ${{ inputs.deploy-target }}
      HOMELAB_APP_FILE_TEMPLATE: ${{ inputs.homelab-app-file }}
      ARGOCD_SERVER: ${{ inputs.argocd-server }}
      KOMODO_STACK: ${{ inputs.komodo-stack }}
      COMPOSE_FILE: ${{ inputs.compose-file }}
      KOMODO_URL: ${{ inputs.komodo-url }}
      REPO_NAME: ${{ github.event.repository.name }}
      REPO_SHA: ${{ github.sha }}
    steps:
      - name: Map built images to pull refs
        run: |
          set -euo pipefail
          file="${HOMELAB_APP_FILE_TEMPLATE//\$\{app\}/$APP}"
          echo "HOMELAB_APP_FILE=${file}" >> "$GITHUB_ENV"
          if [ "$DEPLOY_TARGET" = komodo ]; then
            echo "Target compose file: ${COMPOSE_FILE}"
          else
            echo "Target Application file: ${file}"
          fi
          [[ -n "$PULL_PREFIX" && "$PULL_PREFIX" != */ ]] || { echo "::error::pull-prefix must be non-empty with no trailing slash"; exit 1; }
          refs="$RUNNER_TEMP/refs.tsv"
          : > "$refs"
          while IFS= read -r img; do
            name=$(jq -r '.name' <<<"$img")
            manifest=$(jq -r '."manifest-image" // empty' <<<"$img")
            built=$(jq -r --arg p "ghcr.io/${GHCR_OWNER}/${name}@" '.[] | select(startswith($p))' <<<"$DIGESTS")
            if [ -z "$built" ]; then
              echo "::error::no digest built for ${name}"
              exit 1
            fi
            digest="${built#*@}"
            new="${PULL_PREFIX}/${GHCR_OWNER}/${name}@${digest}"
            [ -n "$manifest" ] || manifest="${PULL_PREFIX}/${GHCR_OWNER}/${name}"
            printf '%s\t%s\t%s\n' "$manifest" "$new" "${name}@${digest:7:12}" >> "$refs"
          done < <(jq -c '.[]' <<<"$IMAGES")
          cat "$refs"

      - name: Mint deployer token
        id: deployer
        if: inputs.images != '[]'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOYER_APP_ID }}
          private-key: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          owner: Gnzaga
          repositories: homelab

      - name: Commit digests to homelab
        id: commit
        if: inputs.deploy-target == 'argocd' && inputs.images != '[]'
        env:
          DEPLOYER_TOKEN: ${{ steps.deployer.outputs.token }}
        run: |
          set -euo pipefail
          t0=$(date +%s)
          echo "::add-mask::${DEPLOYER_TOKEN}"

          bindir="$RUNNER_TEMP/bin"
          mkdir -p "$bindir"
          YQ_VERSION=v4.54.1
          if ! { command -v yq >/dev/null 2>&1 && yq --version 2>/dev/null | grep -q 'mikefarah/yq.*version v4'; }; then
            base="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
            curl -fsSL -o "$bindir/yq" "$base/yq_linux_amd64"
            curl -fsSL -o "$RUNNER_TEMP/yq-checksums" "$base/checksums"
            sha=$(awk '$1 == "yq_linux_amd64" {print $19}' "$RUNNER_TEMP/yq-checksums")
            [ -n "$sha" ] || { echo "::error::yq SHA-256 not found in checksums"; exit 1; }
            echo "$sha  $bindir/yq" | sha256sum -c -
            chmod 0755 "$bindir/yq"
            export PATH="$bindir:$PATH"
          fi

          repo_dir="$RUNNER_TEMP/homelab"
          git clone --depth 1 "https://x-access-token:${DEPLOYER_TOKEN}@github.com/Gnzaga/homelab.git" "$repo_dir"
          cd "$repo_dir"
          git config user.name "gnzaga-deployer[bot]"
          git config user.email "noreply@github.com"

          file="$HOMELAB_APP_FILE"
          if [ ! -f "$file" ]; then
            echo "::error::${file} not found in homelab.git"
            exit 1
          fi
          count=$(yq 'select(.kind == "Application" and .metadata.name == strenv(APP)) | .metadata.name' "$file" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one Application named ${APP} in ${file}, found ${count}"
            exit 1
          fi

          parts=()
          while IFS=$'\t' read -r manifest new label; do
            parts+=("$label")
            # Escape regex metacharacters so the prefix match is exact.
            pat=$(printf '%s' "$manifest" | sed 's|[][\.*^$/]|\\&|g')
            export PAT="$pat" NEW="${manifest}=${new}"
            yq -i '
              with(select(.kind == "Application" and .metadata.name == strenv(APP));
                .spec.source.kustomize.images = (
                  ((.spec.source.kustomize.images // []) | map(select(
                    test("^" + strenv(PAT) + "[@:=]") | not
                  ))) + [strenv(NEW)]
                )
              )' "$file"
          done < "$RUNNER_TEMP/refs.tsv"

          if git diff --quiet -- "$file"; then
            echo "No digest change for ${APP}; nothing to commit"
          else
            git add -- "$file"
            joined=""
            for p in "${parts[@]}"; do joined+="${joined:+, }${p}"; done
            msg="deploy(${APP}): ${joined} from ${REPO_NAME}@${REPO_SHA:0:7}"
            git commit -q -m "$msg"
            branch=$(git rev-parse --abbrev-ref HEAD)
            pushed=0
            for attempt in 1 2 3; do
              if push_err=$(git push origin "HEAD:refs/heads/${branch}" 2>&1); then
                pushed=1
                break
              fi
              echo "$push_err"
              if grep -qiE 'protected branch|GH006|Required status check' <<<"$push_err"; then
                break
              fi
              echo "push attempt ${attempt} rejected; rebasing onto origin/${branch}"
              if ! git pull -q --rebase origin "$branch"; then
                git rebase --abort 2>/dev/null || true
                echo "::error::rebase onto origin/${branch} failed"
                exit 1
              fi
            done
            if [ "$pushed" != 1 ]; then
              if ! grep -qiE 'protected branch|GH006|Required status check' <<<"${push_err:-}"; then
                echo "::error::push to homelab failed after 3 attempts"
                exit 1
              fi
              echo "::notice::direct push to ${branch} blocked by branch protection; opening a pull request"
              if ! command -v gh >/dev/null 2>&1; then
                GH_VERSION=2.101.0
                GH_SHA256=9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
                curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
                echo "${GH_SHA256}  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
                tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
                install -m 0755 "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$bindir/gh"
                export PATH="$bindir:$PATH"
              fi
              export GH_TOKEN="$DEPLOYER_TOKEN"
              pr_branch="deploy/${APP}-${REPO_SHA:0:7}-${GITHUB_RUN_ID}"
              git push -q origin "HEAD:refs/heads/${pr_branch}"
              pr_url=$(gh pr create --repo Gnzaga/homelab --base "$branch" --head "$pr_branch" \
                --title "$msg" --body "Deploy run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
              gh pr merge "$pr_url" --auto --merge --delete-branch
              deadline=$(( $(date +%s) + 600 ))
              while :; do
                pr=$(gh pr view "$pr_url" --json state,mergeStateStatus,mergeCommit)
                state=$(jq -r '.state' <<<"$pr")
                if [ "$state" = MERGED ]; then
                  merged_sha=$(jq -r '.mergeCommit.oid // empty' <<<"$pr")
                  break
                fi
                if [ "$state" = CLOSED ]; then
                  echo "::error::${pr_url} was closed without merging"
                  exit 1
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "::error::${pr_url} not merged within 10 minutes (state: ${state}, merge state: $(jq -r '.mergeStateStatus' <<<"$pr"))"
                  exit 1
                fi
                if [ "$(jq -r '.mergeStateStatus' <<<"$pr")" = BEHIND ]; then
                  gh pr update-branch "$pr_url" || echo "::warning::update-branch failed; will retry"
                fi
                sleep 10
              done
              [ -n "$merged_sha" ] || { echo "::error::${pr_url} reported no merge commit"; exit 1; }
              echo "Merged ${pr_url} as ${merged_sha}"
              git fetch -q --depth 1 origin "$merged_sha"
              git checkout -q "$merged_sha" -- "$file"
            fi
          fi

          echo "sha=${merged_sha:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          printf 'commit\t%s\n' "$(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/timings.tsv"

      - name: Sync ArgoCD and wait for health
        if: inputs.deploy-target == 'argocd' && inputs.images != '[]'
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          t0=$(date +%s)
          bindir="$RUNNER_TEMP/bin"
          mkdir -p "$bindir"
          ARGOCD_VERSION=v3.2.5
          base="https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}"
          curl -fsSL -o "$bindir/argocd" "$base/argocd-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/argocd-checksums.txt" "$base/cli_checksums.txt"
          sha=$(awk '$2 == "argocd-linux-amd64" {print $1}' "$RUNNER_TEMP/argocd-checksums.txt")
          [ -n "$sha" ] || { echo "::error::argocd SHA-256 not found in checksums"; exit 1; }
          echo "$sha  $bindir/argocd" | sha256sum -c -
          chmod 0755 "$bindir/argocd"
          export PATH="$bindir:$PATH"
          acd=(argocd --server "$ARGOCD_SERVER" --plaintext --grpc-web --auth-token "$ARGOCD_AUTH_TOKEN")

          # The root app (homelab-apps) auto-syncs; a refresh normally starts that sync.
          # An explicit sync is only a nudge: "operation already in progress" means
          # auto-sync is already applying our commit, which is what we want.
          "${acd[@]}" app get homelab-apps --refresh >/dev/null
          if ! out=$("${acd[@]}" app sync homelab-apps --async 2>&1); then
            if grep -qi 'another operation is already in progress' <<<"$out"; then
              echo "homelab-apps auto-sync already running; waiting for it to apply ${APP}"
            else
              echo "$out"
              exit 1
            fi
          fi

          ok=0
          for _ in $(seq 1 120); do
            current=$("${acd[@]}" app get "$APP" -o json | jq -r '(.spec.source.kustomize.images // [])[]')
            missing=0
            while IFS=$'\t' read -r manifest new _; do
              grep -qxF "${manifest}=${new}" <<<"$current" || missing=1
            done < "$RUNNER_TEMP/refs.tsv"
            if [ "$missing" = 0 ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::ArgoCD did not pick up the new digests for ${APP} within 600s"
            exit 1
          fi

          # Child apps auto-sync too; "operation already in progress" means ArgoCD is
          # already rolling out our change, so just wait for it.
          if ! out=$("${acd[@]}" app sync "$APP" --async 2>&1); then
            if grep -qi 'another operation is already in progress' <<<"$out"; then
              echo "${APP} auto-sync already running; waiting for health"
            else
              echo "$out"
              exit 1
            fi
          fi
          "${acd[@]}" app wait "$APP" --sync --health --timeout 600
          printf 'argocd\t%s\n' "$(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/timings.tsv"

      - name: Sync ArgoCD app and wait for health (deploy-only)
        if: inputs.deploy-target == 'argocd' && inputs.images == '[]'
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          t0=$(date +%s)
          bindir="$RUNNER_TEMP/bin"
          mkdir -p "$bindir"
          ARGOCD_VERSION=v3.2.5
          base="https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}"
          curl -fsSL -o "$bindir/argocd" "$base/argocd-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/argocd-checksums.txt" "$base/cli_checksums.txt"
          sha=$(awk '$2 == "argocd-linux-amd64" {print $1}' "$RUNNER_TEMP/argocd-checksums.txt")
          [ -n "$sha" ] || { echo "::error::argocd SHA-256 not found in checksums"; exit 1; }
          echo "$sha  $bindir/argocd" | sha256sum -c -
          chmod 0755 "$bindir/argocd"
          export PATH="$bindir:$PATH"
          acd=(argocd --server "$ARGOCD_SERVER" --plaintext --grpc-web --auth-token "$ARGOCD_AUTH_TOKEN")

          # Child apps auto-sync too; "operation already in progress" means ArgoCD is
          # already rolling out our change, so just wait for it.
          if ! out=$("${acd[@]}" app sync "$APP" --async 2>&1); then
            if grep -qi 'another operation is already in progress' <<<"$out"; then
              echo "${APP} auto-sync already running; waiting for health"
            else
              echo "$out"
              exit 1
            fi
          fi
          "${acd[@]}" app wait "$APP" --sync --health --timeout 600
          printf 'argocd\t%s\n' "$(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/timings.tsv"

      - name: Commit compose digests to homelab
        id: compose-commit
        if: inputs.deploy-target == 'komodo'
        env:
          DEPLOYER_TOKEN: ${{ steps.deployer.outputs.token }}
        run: |
          set -euo pipefail
          t0=$(date +%s)
          echo "::add-mask::${DEPLOYER_TOKEN}"

          bindir="$RUNNER_TEMP/bin"
          mkdir -p "$bindir"
          YQ_VERSION=v4.54.1
          if ! { command -v yq >/dev/null 2>&1 && yq --version 2>/dev/null | grep -q 'mikefarah/yq.*version v4'; }; then
            base="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
            curl -fsSL -o "$bindir/yq" "$base/yq_linux_amd64"
            curl -fsSL -o "$RUNNER_TEMP/yq-checksums" "$base/checksums"
            sha=$(awk '$1 == "yq_linux_amd64" {print $19}' "$RUNNER_TEMP/yq-checksums")
            [ -n "$sha" ] || { echo "::error::yq SHA-256 not found in checksums"; exit 1; }
            echo "$sha  $bindir/yq" | sha256sum -c -
            chmod 0755 "$bindir/yq"
            export PATH="$bindir:$PATH"
          fi

          repo_dir="$RUNNER_TEMP/homelab"
          git clone --depth 1 "https://x-access-token:${DEPLOYER_TOKEN}@github.com/Gnzaga/homelab.git" "$repo_dir"
          cd "$repo_dir"
          git config user.name "gnzaga-deployer[bot]"
          git config user.email "noreply@github.com"

          file="$COMPOSE_FILE"
          if [ ! -f "$file" ]; then
            echo "::error::${file} not found in homelab.git"
            exit 1
          fi

          parts=()
          while IFS=$'\t' read -r manifest new label; do
            parts+=("$label")
            export M="$manifest" NEW="$new"
            # Image name with any @digest and :tag stripped, compared exactly.
            matches=$(yq '[.services[] | select(((.image // "") | sub("@.*$"; "") | sub(":[^/:]+$"; "")) == strenv(M))] | length' "$file")
            if [ "$matches" = 0 ]; then
              echo "::error::no service in ${file} uses image ${M}"
              exit 1
            fi
            yq -i '
              with(.services[] | select(((.image // "") | sub("@.*$"; "") | sub(":[^/:]+$"; "")) == strenv(M));
                .image = strenv(NEW)
              )' "$file"
            echo "${matches} service(s) in ${file} set to ${NEW}"
          done < "$RUNNER_TEMP/refs.tsv"

          if git diff --quiet -- "$file"; then
            echo "No digest change for ${KOMODO_STACK}; nothing to commit"
          else
            git add -- "$file"
            joined=""
            for p in "${parts[@]}"; do joined+="${joined:+, }${p}"; done
            msg="deploy(${KOMODO_STACK}): ${joined} from ${REPO_NAME}@${REPO_SHA:0:7}"
            git commit -q -m "$msg"
            branch=$(git rev-parse --abbrev-ref HEAD)
            pushed=0
            for attempt in 1 2 3; do
              if push_err=$(git push origin "HEAD:refs/heads/${branch}" 2>&1); then
                pushed=1
                break
              fi
              echo "$push_err"
              if grep -qiE 'protected branch|GH006|Required status check' <<<"$push_err"; then
                break
              fi
              echo "push attempt ${attempt} rejected; rebasing onto origin/${branch}"
              if ! git pull -q --rebase origin "$branch"; then
                git rebase --abort 2>/dev/null || true
                echo "::error::rebase onto origin/${branch} failed"
                exit 1
              fi
            done
            if [ "$pushed" != 1 ]; then
              if ! grep -qiE 'protected branch|GH006|Required status check' <<<"${push_err:-}"; then
                echo "::error::push to homelab failed after 3 attempts"
                exit 1
              fi
              echo "::notice::direct push to ${branch} blocked by branch protection; opening a pull request"
              if ! command -v gh >/dev/null 2>&1; then
                GH_VERSION=2.101.0
                GH_SHA256=9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
                curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
                echo "${GH_SHA256}  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
                tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
                install -m 0755 "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$bindir/gh"
                export PATH="$bindir:$PATH"
              fi
              export GH_TOKEN="$DEPLOYER_TOKEN"
              pr_branch="deploy/${APP}-${REPO_SHA:0:7}-${GITHUB_RUN_ID}"
              git push -q origin "HEAD:refs/heads/${pr_branch}"
              pr_url=$(gh pr create --repo Gnzaga/homelab --base "$branch" --head "$pr_branch" \
                --title "$msg" --body "Deploy run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
              gh pr merge "$pr_url" --auto --merge --delete-branch
              deadline=$(( $(date +%s) + 600 ))
              while :; do
                pr=$(gh pr view "$pr_url" --json state,mergeStateStatus,mergeCommit)
                state=$(jq -r '.state' <<<"$pr")
                if [ "$state" = MERGED ]; then
                  merged_sha=$(jq -r '.mergeCommit.oid // empty' <<<"$pr")
                  break
                fi
                if [ "$state" = CLOSED ]; then
                  echo "::error::${pr_url} was closed without merging"
                  exit 1
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "::error::${pr_url} not merged within 10 minutes (state: ${state}, merge state: $(jq -r '.mergeStateStatus' <<<"$pr"))"
                  exit 1
                fi
                if [ "$(jq -r '.mergeStateStatus' <<<"$pr")" = BEHIND ]; then
                  gh pr update-branch "$pr_url" || echo "::warning::update-branch failed; will retry"
                fi
                sleep 10
              done
              [ -n "$merged_sha" ] || { echo "::error::${pr_url} reported no merge commit"; exit 1; }
              echo "Merged ${pr_url} as ${merged_sha}"
              git fetch -q --depth 1 origin "$merged_sha"
              git checkout -q "$merged_sha" -- "$file"
            fi
          fi

          echo "sha=${merged_sha:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          printf 'commit\t%s\n' "$(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/timings.tsv"

      - name: Deploy via Komodo and wait for Update
        if: inputs.deploy-target == 'komodo'
        env:
          KOMODO_KEY: ${{ secrets.KOMODO_KEY }}
          KOMODO_SECRET: ${{ secrets.KOMODO_SECRET }}
        run: |
          set -euo pipefail
          t0=$(date +%s)

          komodo() {
            curl -sS --fail-with-body --max-time 60 -X POST "${KOMODO_URL}/$1" \
              -H 'Content-Type: application/json' \
              -H "X-API-KEY: ${KOMODO_KEY}" \
              -H "X-API-SECRET: ${KOMODO_SECRET}" \
              -d "$2"
          }

          # Komodo responses can carry raw control characters inside strings (compose logs),
          # which jq rejects. Re-serialize through Python so jq only ever reads valid JSON.
          kjson() {
            python3 -I -c 'import json,sys; sys.stdout.write(json.dumps(json.loads(sys.stdin.read(), strict=False)))'
          }

          content="$RUNNER_TEMP/homelab/${COMPOSE_FILE}"
          [ -f "$content" ] || { echo "::error::${COMPOSE_FILE} not found in the homelab checkout"; exit 1; }
          if ! wresp=$(komodo write "$(jq -nc --arg s "$KOMODO_STACK" --rawfile c "$content" '{type: "UpdateStack", params: {id: $s, config: {file_contents: $c}}}')"); then
            echo "::error::Komodo write UpdateStack failed for ${KOMODO_STACK}"
            head -c 2000 <<<"$wresp"
            exit 1
          fi
          err=$(kjson <<<"$wresp" | jq -r '.error // empty')
          if [ -n "$err" ]; then
            echo "::error::Komodo UpdateStack rejected for ${KOMODO_STACK}: ${err:0:2000}"
            exit 1
          fi
          echo "Pushed ${COMPOSE_FILE} into Komodo stack ${KOMODO_STACK}"

          if ! resp=$(komodo execute "$(jq -nc --arg s "$KOMODO_STACK" '{type: "DeployStack", params: {stack: $s}}')"); then
            echo "::error::Komodo execute DeployStack failed for ${KOMODO_STACK}"
            head -c 2000 <<<"$resp"
            exit 1
          fi
          id=$(kjson <<<"$resp" | jq -r 'if (._id | type) == "object" then ._id["$oid"] else (._id // .id // empty) end')
          if [ -z "$id" ] || [ "$id" = null ]; then
            echo "::error::DeployStack response carried no Update id"
            head -c 2000 <<<"$resp"
            exit 1
          fi
          echo "Komodo Update ${id} started for stack ${KOMODO_STACK}"

          deadline=$(( $(date +%s) + 600 ))
          status=""
          while :; do
            upd=$(komodo read "$(jq -nc --arg id "$id" '{type: "GetUpdate", params: {id: $id}}')" 2>/dev/null) || upd=""
            status=$(kjson <<<"$upd" 2>/dev/null | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$status" = "Complete" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Komodo Update ${id} did not complete within 10 minutes (last status: ${status:-unknown})"
              exit 1
            fi
            sleep 5
          done

          success=$(kjson <<<"$upd" | jq -r '.success')
          if [ "$success" != true ]; then
            echo "::error::Komodo Update ${id} for ${KOMODO_STACK} finished with success=${success}"
            kjson <<<"$upd" | jq -c '(.logs // [])[] | {stage, success, stderr: ((.stderr // "")[0:2000])}' || true
            exit 1
          fi
          printf 'komodo\t%s\n' "$(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/timings.tsv"

      - name: Job summary
        if: always()
        env:
          HOMELAB_COMMIT: ${{ steps.commit.outputs.sha || steps.compose-commit.outputs.sha }}
        run: |
          {
            echo "## Deploy ${APP}"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            if [ -s "$RUNNER_TEMP/refs.tsv" ]; then
              while IFS=$'\t' read -r _ new _; do
                echo "| \`${new%@*}\` | \`${new#*@}\` |"
              done < "$RUNNER_TEMP/refs.tsv"
            fi
            echo
            echo "| Step | Seconds |"
            echo "| --- | --- |"
            if [ -s "$RUNNER_TEMP/timings.tsv" ]; then
              while IFS=$'\t' read -r step secs; do
                echo "| ${step} | ${secs} |"
              done < "$RUNNER_TEMP/timings.tsv"
            fi
            echo
            if [ -n "$HOMELAB_COMMIT" ]; then
              echo "Homelab commit: https://github.com/Gnzaga/homelab/commit/${HOMELAB_COMMIT}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
